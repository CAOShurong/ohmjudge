<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
  <title id="title">OhmJudge</title>
  <desc id="desc">An academic graphical abstract showing generated electrical-engineering tasks, deterministic measurement, and an auditable verdict.</desc>
  <rect width="1200" height="500" rx="8" fill="#fbfaf7"/>
  <rect x="1" y="1" width="1198" height="498" rx="7" fill="none" stroke="#d8d5cd"/>

  <g font-family="Inter,Segoe UI,Arial,sans-serif">
    <text x="72" y="78" fill="#15324b" font-size="15" font-weight="700" letter-spacing="2.4">OPEN RESEARCH SOFTWARE · ELECTRICAL ENGINEERING</text>
    <text x="68" y="153" fill="#172630" font-family="Georgia,Times New Roman,serif" font-size="70" font-weight="700">OhmJudge</text>
    <text x="72" y="198" fill="#53636d" font-size="23">Fresh scalar EE tasks. Deterministic local grading.</text>

    <line x1="72" y1="236" x2="534" y2="236" stroke="#c9c5bc"/>
    <text x="72" y="274" fill="#172630" font-size="15" font-weight="700">THE DECISION</text>
    <text x="72" y="306" fill="#53636d" font-size="17">Did a model solve the same committed suite—</text>
    <text x="72" y="332" fill="#53636d" font-size="17">with the correct value, dimension, and unit?</text>

    <g transform="translate(72 372)">
      <circle cx="6" cy="6" r="6" fill="#2f6f9f"/>
      <text x="22" y="12" fill="#334954" font-size="15">No API required</text>
      <circle cx="172" cy="6" r="6" fill="#b65d3a"/>
      <text x="188" y="12" fill="#334954" font-size="15">50 templates / 10 domains</text>
      <circle cx="398" cy="6" r="6" fill="#667b42"/>
      <text x="414" y="12" fill="#334954" font-size="15">Plain evidence files</text>
    </g>
  </g>

  <g transform="translate(618 64)" font-family="Inter,Segoe UI,Arial,sans-serif">
    <rect width="510" height="366" rx="4" fill="#ffffff" stroke="#c9c5bc"/>
    <text x="34" y="42" fill="#15324b" font-size="14" font-weight="700">SEEDED RESPONSE TRACE</text>
    <text x="471" y="42" text-anchor="end" fill="#6d7a82" font-size="12">suite 2026 · task 31</text>

    <line x1="58" y1="78" x2="58" y2="258" stroke="#9ea8ae"/>
    <line x1="58" y1="258" x2="468" y2="258" stroke="#9ea8ae"/>
    <g stroke="#e3e1db" stroke-width="1">
      <line x1="58" y1="123" x2="468" y2="123"/>
      <line x1="58" y1="168" x2="468" y2="168"/>
      <line x1="58" y1="213" x2="468" y2="213"/>
      <line x1="160" y1="78" x2="160" y2="258"/>
      <line x1="263" y1="78" x2="263" y2="258"/>
      <line x1="365" y1="78" x2="365" y2="258"/>
    </g>
    <g fill="#7a858c" font-size="11">
      <text x="48" y="82" text-anchor="end">1.0</text>
      <text x="48" y="172" text-anchor="end">0.0</text>
      <text x="48" y="262" text-anchor="end">−1.0</text>
      <text x="58" y="280" text-anchor="middle">0</text>
      <text x="263" y="280" text-anchor="middle">time</text>
      <text x="468" y="280" text-anchor="middle">T</text>
    </g>
    <path d="M58 168 C79 83 100 83 120 168 S161 253 181 168 S222 83 242 168 S283 253 304 168 S345 83 365 168 S406 253 427 168" fill="none" stroke="#2f6f9f" stroke-width="3"/>
    <circle cx="427" cy="168" r="5" fill="#2f6f9f"/>
    <line x1="427" y1="168" x2="456" y2="135" stroke="#b65d3a" stroke-width="2"/>
    <circle cx="456" cy="135" r="5" fill="#b65d3a"/>
    <text x="468" y="126" fill="#b65d3a" font-size="12" font-weight="700">within tolerance</text>

    <line x1="34" y1="306" x2="476" y2="306" stroke="#d8d5cd"/>
    <g transform="translate(34 326)">
      <text y="15" fill="#5f6e76" font-size="12">observed</text>
      <text x="76" y="15" fill="#172630" font-size="14" font-weight="700">15.59 kW</text>
      <text x="210" y="15" fill="#5f6e76" font-size="12">reference</text>
      <text x="286" y="15" fill="#172630" font-size="14" font-weight="700">15.5885 kW</text>
      <rect x="398" y="-3" width="78" height="28" rx="3" fill="#e7efe2" stroke="#aebd9d"/>
      <text x="437" y="16" text-anchor="middle" fill="#3e5b2e" font-size="12" font-weight="800">PASS</text>
    </g>
  </g>

  <text x="72" y="462" fill="#7b858b" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="14">generate → commit → collect → grade → audit</text>
</svg>
