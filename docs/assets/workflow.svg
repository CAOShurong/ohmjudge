<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="350" viewBox="0 0 1200 350" role="img" aria-labelledby="title desc">
  <title id="title">OhmJudge workflow</title>
  <desc id="desc">Five stages: generate fresh tasks, commit and separate answers, collect in any model web app, grade locally, then inspect and publish evidence.</desc>
  <defs>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5dd6c7"/>
      <stop offset="1" stop-color="#79a7ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="7" stdDeviation="10" flood-color="#031015" flood-opacity=".28"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0l10 5-10 5z" fill="#6aaebe"/>
    </marker>
  </defs>
  <rect width="1200" height="350" rx="24" fill="#091921"/>
  <text x="60" y="58" fill="#edf9f7" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="27" font-weight="720">One experiment, five auditable stages</text>
  <text x="60" y="87" fill="#8eadae" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15">Artifacts stay local until you choose to publish them.</text>

  <path d="M190 194h76M416 194h76M642 194h76M868 194h76" stroke="url(#line)" stroke-width="3" marker-end="url(#arrow)"/>

  <g font-family="Inter,Segoe UI,Arial,sans-serif" filter="url(#shadow)">
    <g transform="translate(60 125)">
      <rect width="130" height="138" rx="18" fill="#102d35" stroke="#2e5a63"/>
      <circle cx="65" cy="43" r="23" fill="#163e44"/>
      <path d="M49 43h10l5-12 8 24 7-12h7" fill="none" stroke="#5dd6c7" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="65" y="88" text-anchor="middle" fill="#e8f7f5" font-size="17" font-weight="700">Generate</text>
      <text x="65" y="112" text-anchor="middle" fill="#91b2b2" font-size="13">seeded EE tasks</text>
    </g>

    <g transform="translate(286 125)">
      <rect width="130" height="138" rx="18" fill="#122a37" stroke="#31536a"/>
      <circle cx="65" cy="43" r="23" fill="#193a4d"/>
      <path d="M52 43h26M65 30v26" stroke="#79a7ff" stroke-width="3" stroke-linecap="round"/>
      <text x="65" y="88" text-anchor="middle" fill="#e8f1ff" font-size="17" font-weight="700">Commit</text>
      <text x="65" y="112" text-anchor="middle" fill="#93aabd" font-size="13">hash + split keys</text>
    </g>

    <g transform="translate(512 125)">
      <rect width="130" height="138" rx="18" fill="#2c2825" stroke="#5c5145"/>
      <circle cx="65" cy="43" r="23" fill="#423830"/>
      <path d="M49 34h32v21H62l-9 7v-7h-4z" fill="none" stroke="#f4bc66" stroke-width="3" stroke-linejoin="round"/>
      <text x="65" y="88" text-anchor="middle" fill="#fff4e2" font-size="17" font-weight="700">Collect</text>
      <text x="65" y="112" text-anchor="middle" fill="#bea98b" font-size="13">any model or API</text>
    </g>

    <g transform="translate(738 125)">
      <rect width="130" height="138" rx="18" fill="#172b36" stroke="#365563"/>
      <circle cx="65" cy="43" r="23" fill="#203b47"/>
      <path d="M49 43l10 10 22-24" fill="none" stroke="#5dd6c7" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="65" y="88" text-anchor="middle" fill="#e8f7f5" font-size="17" font-weight="700">Grade</text>
      <text x="65" y="112" text-anchor="middle" fill="#91b2b2" font-size="13">local Python rules</text>
    </g>

    <g transform="translate(964 125)">
      <rect width="176" height="138" rx="18" fill="#18283d" stroke="#385579"/>
      <circle cx="88" cy="43" r="23" fill="#213a5a"/>
      <path d="M72 51V40m11 11V32m11 19V37m11 14V26" stroke="#79a7ff" stroke-width="4" stroke-linecap="round"/>
      <text x="88" y="88" text-anchor="middle" fill="#e8f1ff" font-size="17" font-weight="700">Inspect + publish</text>
      <text x="88" y="112" text-anchor="middle" fill="#93aabd" font-size="13">report every result</text>
    </g>
  </g>

  <g font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="12" fill="#718f92">
    <text x="60" y="300">tasks.private.jsonl</text>
    <text x="286" y="300">prompts.public.jsonl</text>
    <text x="512" y="300">responses.jsonl</text>
    <text x="738" y="300">grades.jsonl</text>
    <text x="964" y="300">report.html</text>
  </g>
</svg>
