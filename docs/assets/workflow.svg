<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 0 1200 390" role="img" aria-labelledby="title desc">
  <title id="title">OhmJudge reproducible evaluation workflow</title>
  <desc id="desc">A five-stage horizontal research workflow from seeded task generation to an audited report, with the artifact produced at each stage.</desc>
  <rect width="1200" height="390" rx="8" fill="#fbfaf7"/>
  <rect x="1" y="1" width="1198" height="388" rx="7" fill="none" stroke="#d8d5cd"/>
  <g font-family="Inter,Segoe UI,Arial,sans-serif">
    <text x="56" y="57" fill="#172630" font-family="Georgia,Times New Roman,serif" font-size="29" font-weight="700">An inspectable experiment, not a hidden leaderboard</text>
    <text x="56" y="86" fill="#64727a" font-size="15">Every transition leaves a portable artifact that another researcher can examine.</text>

    <line x1="130" y1="185" x2="1070" y2="185" stroke="#9ba7ad" stroke-width="2"/>
    <g fill="#fbfaf7" stroke-width="3">
      <circle cx="130" cy="185" r="22" stroke="#2f6f9f"/>
      <circle cx="365" cy="185" r="22" stroke="#2f6f9f"/>
      <circle cx="600" cy="185" r="22" stroke="#b65d3a"/>
      <circle cx="835" cy="185" r="22" stroke="#2f6f9f"/>
      <circle cx="1070" cy="185" r="22" stroke="#667b42"/>
    </g>
    <g font-size="14" font-weight="800" text-anchor="middle">
      <text x="130" y="190" fill="#2f6f9f">01</text>
      <text x="365" y="190" fill="#2f6f9f">02</text>
      <text x="600" y="190" fill="#b65d3a">03</text>
      <text x="835" y="190" fill="#2f6f9f">04</text>
      <text x="1070" y="190" fill="#667b42">05</text>
    </g>

    <g text-anchor="middle">
      <g transform="translate(130 0)">
        <text y="137" fill="#172630" font-size="17" font-weight="700">Generate</text>
        <text y="223" fill="#5f6e76" font-size="13">Seeded EE tasks</text>
        <text y="300" fill="#15324b" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="12">tasks.private.jsonl</text>
      </g>
      <g transform="translate(365 0)">
        <text y="137" fill="#172630" font-size="17" font-weight="700">Commit</text>
        <text y="223" fill="#5f6e76" font-size="13">Freeze suite + prompts</text>
        <text y="300" fill="#15324b" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="12">prompts.public.jsonl</text>
      </g>
      <g transform="translate(600 0)">
        <text y="137" fill="#172630" font-size="17" font-weight="700">Collect</text>
        <text y="223" fill="#5f6e76" font-size="13">Web app or optional API</text>
        <text y="300" fill="#7a432c" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="12">responses.jsonl</text>
      </g>
      <g transform="translate(835 0)">
        <text y="137" fill="#172630" font-size="17" font-weight="700">Grade</text>
        <text y="223" fill="#5f6e76" font-size="13">Local unit-aware rules</text>
        <text y="300" fill="#15324b" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="12">grades.jsonl</text>
      </g>
      <g transform="translate(1070 0)">
        <text y="137" fill="#172630" font-size="17" font-weight="700">Audit</text>
        <text y="223" fill="#5f6e76" font-size="13">Coverage + recomputation</text>
        <text y="300" fill="#42552e" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="12">audit.json</text>
      </g>
    </g>
    <text x="56" y="352" fill="#68757c" font-size="13">Private reference values remain separate from public prompts until the evaluation is complete.</text>
  </g>
</svg>
