name: Bug report
description: Report a reproducible defect in generation, grading, providers, or reports.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "Do not paste API keys or unpublished private task files."
  - type: input
    id: version
    attributes:
      label: OhmJudge version
      placeholder: "0.1.0 or commit SHA"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: "Python 3.13, Windows 11"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Include the exact command, expected behavior, and actual behavior.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Use synthetic or already-public artifacts only.
      render: shell
    validations:
      required: true
