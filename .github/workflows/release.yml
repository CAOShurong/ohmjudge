name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  test:
    name: Test ${{ matrix.os }} · Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, python: "3.11" }
          - { os: ubuntu-latest, python: "3.14" }
          - { os: windows-latest, python: "3.11" }
          - { os: windows-latest, python: "3.14" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install .
      - run: python -m unittest discover -s tests -v

  build:
    name: Build once and verify tag parity
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade build twine
      - name: The tag and package version must agree
        run: |
          python - <<'PY'
          import os, re, sys

          source = open("src/ohmjudge/__init__.py", encoding="utf-8").read()
          version = re.search(r'__version__ = "([^"]+)"', source).group(1)
          tag = os.environ["GITHUB_REF_NAME"].removeprefix("v")
          if version != tag:
              sys.exit(f"tag {tag!r} does not match __version__ {version!r}")
          print(f"tag and package agree on {version}")
          PY
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/

  install:
    name: Install public candidate on ${{ matrix.os }}
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - name: Install and run on Unix
        if: runner.os != 'Windows'
        run: |
          python -m venv clean-install
          clean-install/bin/python -m pip install dist/*.whl
          clean-install/bin/ohmjudge doctor
      - name: Install and run on Windows
        if: runner.os == 'Windows'
        run: |
          python -m venv clean-install
          $wheel = (Get-ChildItem dist\*.whl).FullName
          .\clean-install\Scripts\python.exe -m pip install $wheel
          .\clean-install\Scripts\ohmjudge.exe doctor

  github-release:
    name: Publish GitHub Release
    needs: install
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - name: Generate and verify SHA-256 manifest
        run: |
          cd dist
          sha256sum *.whl *.tar.gz > SHA256SUMS
          sha256sum --check SHA256SUMS
      - name: Attest release distributions
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: dist/SHA256SUMS
      - uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: dist/*
          generate_release_notes: true
