name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install .
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Smoke-test CLI and deterministic artifacts
        run: |
          ohmjudge doctor
          ohmjudge generate --count 50 --seed 2026 --output tasks.private.jsonl --public-output prompts.public.jsonl
          ohmjudge lab --tasks tasks.private.jsonl --output ohmjudge-lab.html
          ohmjudge demo --count 50 --seed 2026 --output build/demo

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Build and inspect distributions
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check dist/*
      - name: Clean-wheel installation smoke test
        run: |
          python -m venv clean-install
          clean-install/bin/python -m pip install dist/*.whl
          clean-install/bin/ohmjudge doctor
          clean-install/bin/ohmjudge generate --count 10 --seed 2026 --output /tmp/tasks.jsonl
      - uses: actions/upload-artifact@v7
        with:
          name: ohmjudge-distributions
          path: dist/
