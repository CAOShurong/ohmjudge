name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install .
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Smoke-test CLI and deterministic artifacts
        run: |
          ohmjudge doctor
          ohmjudge generate --count 50 --seed 2026 --output tasks.private.jsonl --public-output prompts.public.jsonl
          ohmjudge lab --tasks tasks.private.jsonl --output ohmjudge-lab.html
          ohmjudge demo --count 50 --seed 2026 --output build/demo
